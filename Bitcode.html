<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Commit Word</title>
</head>

<body>
    <section id="body">
        <input type="text" id="wordInput" placeholder="Enter a word (A-Z)" />
        <div class="container">
            <div class="weekday-labels">
                <span>Mon</span>
                <span>Wed</span>
                <span>Fri</span>
            </div>
            <div>
                <div class="month-labels">
                    <span>Jan</span>
                    <span>Feb</span>
                    <span>Mar</span>
                    <span>Apr</span>
                    <span>May</span>
                    <span>Jun</span>
                    <span>Jul</span>
                    <span>Aug</span>
                    <span>Sep</span>
                    <span>Oct</span>
                    <span>Nov</span>
                    <span>Dec</span>
                </div>
                <div class="calendar">
                    <!-- Days will be dynamically generated here -->
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p class="credit">
            Created with ❤️ by
            <strong class="creator">
                <a href="https://01code.vercel.app/" id="brand">
                    Bitcode
                </a>
                <a class="smBrand" href="https://www.linkedin.com/company/01code/" target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
            </strong>
        </p>
        <p>
            <a class="sm" href="https://www.instagram.com/oussama_roui" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a class="sm" href="https://github.com/oussamaroui" target="_blank">
                <i class="fab fa-github"></i>
            </a>
            <a class="sm" href="https://x.com/oussama_roui" target="_blank">
                <i class="fab fa-twitter"></i>
            </a>
            <a class="sm" href="https://www.linkedin.com/in/oussama-roui/" target="_blank">
                <i class="fab fa-linkedin"></i>
            </a>
        </p>
    </footer>
</body>

</html>
